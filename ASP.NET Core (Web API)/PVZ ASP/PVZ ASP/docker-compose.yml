services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reviewer_db
    ports:
      - "5433:5432"
    volumes:
      - b50fb90a793294c53a02572f091c521f290592512c47b7c415cf2ccb133c4b48:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewer-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=reviewer_db;Username=postgres;Password=postgres

volumes:
  b50fb90a793294c53a02572f091c521f290592512c47b7c415cf2ccb133c4b48:
    external: true